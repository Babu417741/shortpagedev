<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GadgetStore — Everything at ₹499</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #06060a;
      color: #f0ebe0;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 80% 55% at 50% 50%, rgba(212,175,95,0.11) 0%, transparent 65%), #06060a;
      pointer-events: none;
    }

    .page {
      position: relative; z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 28px;
      max-width: 680px;
      width: 100%;
    }

    /* EYEBROW */
    .eyebrow {
      font-size: 0.62rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(212,175,95,0.55);
    }

    /* HEADLINE */
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 900;
      line-height: 1.05;
    }
    h1 em {
      display: block;
      font-style: italic;
      font-weight: 400;
      color: #d4af5f;
    }

    /* PRODUCT IMAGE */
    .product-img {
      width: min(320px, 80vw);
      height: min(320px, 80vw);
      object-fit: contain;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 12px;
      filter: drop-shadow(0 12px 40px rgba(212,175,95,0.18));
    }

    /* PRICE */
    .price-row {
      display: flex; align-items: center; gap: 14px; justify-content: center;
    }
    .price-was {
      font-size: 1rem;
      color: rgba(240,235,224,0.25);
      text-decoration: line-through;
    }
    .price-now {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      color: #f0d080;
      line-height: 1;
    }
    .price-badge {
      background: rgba(255,100,60,0.15);
      border: 1px solid rgba(255,100,60,0.3);
      color: #ff8060;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
    }

    /* SHOP NOW BUTTON */
    .btn-buy {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: min(580px, 92vw);
      padding: 36px 40px;
      background: linear-gradient(135deg, #bfa040, #f5d878, #d4af5f, #f0cc60);
      background-size: 300% 300%;
      color: #07060a;
      text-decoration: none;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
      box-shadow:
        0 0 0 1px rgba(212,175,95,0.4),
        0 10px 50px rgba(212,175,95,0.3),
        0 24px 64px rgba(0,0,0,0.5);
      animation: shimmer-bg 5s ease infinite;
    }
    @keyframes shimmer-bg {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    .btn-buy::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
      transform: translateX(-120%);
      transition: transform 0.65s ease;
    }
    .btn-buy:hover::before { transform: translateX(120%); }
    .btn-buy:hover {
      transform: translateY(-5px) scale(1.012);
      box-shadow:
        0 0 0 2px rgba(245,216,120,0.55),
        0 20px 70px rgba(212,175,95,0.42),
        0 40px 90px rgba(0,0,0,0.65);
    }
    .btn-buy:active { transform: translateY(-2px) scale(1.005); }

    .btn-main {
      font-family: 'Inter', sans-serif;
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .btn-sub {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(0.8rem, 1.8vw, 0.95rem);
      color: rgba(7,6,10,0.4);
    }

    /* TRUST */
    .trust {
      display: flex; align-items: center; gap: 16px;
      flex-wrap: wrap; justify-content: center;
    }
    .t {
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.2);
    }
    .t-sep { color: rgba(255,255,255,0.08); }

    footer {
      position: fixed; bottom: 16px;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(240,235,224,0.1);
      z-index: 1;
    }

    @media (max-width: 480px) {
      .t-sep { display: none; }
      .btn-buy { padding: 28px 20px; }
    }
  </style>
</head>
<body>

  <div class="page">

    <p class="eyebrow">Welcome to GadgetStore</p>

    <h1>All Your Favourite<br><em>Products at ₹299.</em></h1>

    <img
      class="product-img"
      src="https://deodap.in/cdn/shop/files/inflatable_sofa_chair_05_multifunctional.jpg?v=1778217286&width=990"
      alt="Inflatable Sofa Chair"
    />

    <div class="price-row">
      <span class="price-was">₹2,999</span>
      <span class="price-now">₹299</span>
      <span class="price-badge">90% OFF</span>
    </div>

    <a class="btn-buy" href="https://jacketswinterclothings.store/" target="_blank">
      <span class="btn-main">🛒 SHOP NOW</span>
      <span class="btn-sub">Get it now at flat ₹299 only</span>
    </a>

    <div class="trust">
      <span class="t">🔒 Secure Checkout</span>
      <span class="t-sep">·</span>
      <span class="t">⚡ Fast Delivery</span>
      <span class="t-sep">·</span>
      <span class="t">✦ Genuine Products</span>
    </div>

  </div>

  <footer>© 2025 GadgetStore · All prices in Indian Rupees</footer>

  <script>
    // ── EASY CONFIG — change these two values only ──
    var REDIRECT_SECONDS = 10;                              // ← seconds before auto redirect
    var REDIRECT_URL     = "https://jacketswinterclothings.store/"; // ← destination link
    // ────────────────────────────────────────────────

    setTimeout(function() {
      window.location.href = REDIRECT_URL;
    }, REDIRECT_SECONDS * 1000);
  </script>

</body>
</html>
